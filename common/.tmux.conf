# Tmux 配置

# 修改前缀键为 Ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# 启用鼠标
set -g mouse on

# 支持更多按键识别
set -g xterm-keys on

# 更快响应
set -s escape-time 0

# 从 1 开始编号窗口和面板
set -g base-index 1
setw -g pane-base-index 1

# 重新加载配置
bind r source-file ~/.tmux.conf \; display "配置已重新加载！"

# 插件
## tmux Plugin Manager
set -g @plugin 'tmux-plugins/tpm'
## 快捷键增强
#set -g @plugin 'tmux-plugins/tmux-sensible'
## 剪贴板增强
set -g @plugin 'tmux-plugins/tmux-yank'
## 自动恢复会话
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-resurrect'
## 状态栏增强
set -g @plugin 'tmux-plugins/tmux-continuum'

run '~/.tmux/plugins/tpm/tpm'

# 新建窗口 prefix + n 创建 [Ctrl + a  n]
bind n new-window
# 删除窗口 prefix + w
bind w kill-window

# -----------------------------
# prefix + 数字切换
bind 0 select-window -t 0
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9

# Ctrl + n / p 切换下一个 / 上一个窗口
bind -n C-j next-window
bind -n C-k previous-window

# -----------------------------
# 分屏快捷键
# Alt+v 水平分屏
bind -n M-v split-window -v

# Alt+b 垂直分屏
bind -n M-b split-window -h

# Alt + m 合并所有 pane，只保留当前
bind -n M-m kill-pane -a

# Alt + x 关闭当前 pane
bind -n M-x kill-pane

# 放大 / 缩小当前 pane
bind -n C-z resize-pane -Z


# 切换 pane 使用 Alt + hjkl（不冲突）
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Pane 边框样式
set -g pane-border-style fg=colour240
set -g pane-active-border-style fg=cyan

# 状态栏
set -g status on
set -g status-interval 1
set -g status-left "#[fg=green]#S"
set -g status-right "#[fg=yellow]%Y-%m-%d %H:%M#[default]"

# 窗口列表高亮当前窗口
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bg=blue,fg=white] #I:#W #[default]"

### --- 复制模式配置（适配无前缀） --- ###

# 使用 vim 风格
setw -g mode-keys vi

# Alt + [ 进入复制模式
#bind -n M-[ copy-mode

# 在复制模式中：v 开始选择
bind -T copy-mode-vi v send -X begin-selection

# 在复制模式中：y 复制选区并退出
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# 自动同步到系统剪贴板（Wayland + X11）
set -g set-clipboard on

# 设置每个 pane 的历史记录行数
set -g history-limit 10000

# 鼠标拖选自动进入 copy-mode 并复制
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"