# Dotfiles 软件包和模块分类配置
#
# 格式：
#   包:逻辑包名       — 系统包（通过 packages-map 映射到各发行版）
#   模块:模块名:分类    — 模块（通过 modules/<名>/install.sh 安装）
#
# 分类说明：
#   基础   — 必装，不可跳过
#   开发工具 — 构建工具、命令行增强工具、编程语言
#   系统工具 — 系统管理、网络、容器等
#   字体   — Nerd Font、CJK 字体
#   浏览器 — 浏览器

# ==================== 基础（必装，不可跳过） ====================
包:git
包:vim
包:zsh
包:tmux
包:curl
包:wget

# ==================== 开发工具 ====================
包:build-tools
包:neofetch
包:fzf
包:ripgrep
包:fd
包:bat
包:zoxide
包:jq

# ==================== 系统工具 ====================
包:htop
包:tree
包:unzip
包:zip
包:xclip
包:net-tools
包:ssh

# ==================== 字体 ====================
包:cjk-font

# ==================== 浏览器 ====================
包:firefox
包:chromium

# ==================== 模块 ====================
模块:node:开发工具
模块:python:开发工具
模块:java:开发工具
模块:rust:开发工具
模块:docker:系统工具
模块:eza:系统工具
模块:nerd-font:字体
