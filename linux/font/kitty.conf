# Kitty 终端字体配置
# 复制此片段到 Kitty 配置中:
#   通常位于 ~/.config/kitty/kitty.conf

# 主字体（英文 + 图标）+ 中文回退
font_family JetBrainsMono Nerd Font
regular_font_family JetBrainsMono Nerd Font
bold_font_family JetBrainsMono Nerd Font Bold
italic_font_family JetBrainsMono Nerd Font Italic
bold_italic_font_family JetBrainsMono Nerd Font Bold Italic

# 中文 CJK 回退字体
variable_font no
# kitty 使用 fallback-font 机制
# 需要安装 nerdfonts-metadata 或手动指定
# 更简单的方式: 安装完整的 JetBrainsMono Nerd Font CJK 版本

# 字体大小
font_size 12.0

# 使用 Nerd Font patch 的图标
# kitty 自动支持 Nerd Font
